<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant POS & Kitchen System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navigation Bar -->
    <nav class="bg-gray-900 text-white px-6 py-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="font-bold text-lg">🍽️ POS Master</a>
            
            <div class="space-x-4 text-sm">
                <a href="{% url 'dashboard' %}" class="hover:text-gray-300">Dashboard</a>
                <a href="{% url 'order_create' %}" class="hover:text-gray-300">POS Terminal</a>
                <a href="{% url 'kitchen_display' %}" class="hover:text-gray-300">Kitchen (KDS)</a>
                <a href="{% url 'table_list' %}" class="hover:text-gray-300">Tables</a>
                <a href="{% url 'menu_list' %}" class="hover:text-gray-300">Menu</a>
                <a href="{% url 'order_history' %}" class="hover:text-gray-300">History</a>
            </div>

            <div class="text-sm text-gray-300">
                Staff: <span class="text-white font-semibold">{{ request.user.username|default:"Admin" }}</span>
            </div>
        </div>
    </nav>

    <!-- Messages -->
    <div class="container mx-auto px-6 mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-2 rounded bg-blue-100 text-blue-800 text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
